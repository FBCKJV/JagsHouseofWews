<svg xmlns="http://www.w3.org/2000/svg" width="400" height="580" viewBox="0 0 400 580" font-family="Georgia, serif" role="img" aria-labelledby="t">
  <title id="t">The 7-year week of 2,520 days split at the abomination into two halves of 1,260 days; from the abomination 1,260, 1,290 and 1,335 days, the extra 30 and 45 making 75 days</title>
  <!-- The week -->
  <text x="200" y="26" text-anchor="middle" fill="#e6c676" font-size="20">THE WEEK · 7 YEARS · 2,520 DAYS</text>
  <text x="200" y="50" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Daniel 9:27</text>
  <rect x="10" y="64" width="190" height="52" fill="#a9c1ea" fill-opacity="0.18" stroke="#a9c1ea" stroke-width="1.5"/>
  <rect x="200" y="64" width="190" height="52" fill="#9b2226" fill-opacity="0.55" stroke="#c9a24b" stroke-width="1.5"/>
  <text x="105" y="98" text-anchor="middle" fill="#ecdfc2" font-size="22">1,260 days</text>
  <text x="295" y="98" text-anchor="middle" fill="#ecdfc2" font-size="22">1,260 days</text>
  <line x1="200" y1="56" x2="200" y2="126" stroke="#e6c676" stroke-width="4"/>
  <text x="105" y="150" text-anchor="middle" fill="#a9c1ea" font-size="21">First half</text>
  <text x="105" y="174" text-anchor="middle" fill="#b9a985" font-size="19">Tribulation</text>
  <text x="105" y="196" text-anchor="middle" fill="#b9a985" font-size="19">of the saints</text>
  <text x="295" y="150" text-anchor="middle" fill="#e6c676" font-size="21">Second half</text>
  <text x="295" y="174" text-anchor="middle" fill="#b9a985" font-size="19">Great</text>
  <text x="295" y="196" text-anchor="middle" fill="#b9a985" font-size="19">tribulation</text>
  <path d="M189 212 L211 212 L200 229 Z" fill="#e6c676"/>
  <text x="200" y="256" text-anchor="middle" fill="#e6c676" font-size="21">Midpoint: abomination</text>
  <text x="200" y="280" text-anchor="middle" fill="#e6c676" font-size="21">of desolation</text>
  <text x="200" y="304" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">at the 1,260-day mark</text>

  <!-- Counted from the abomination -->
  <line x1="10" y1="324" x2="390" y2="324" stroke="#c9a24b" stroke-opacity="0.38"/>
  <text x="200" y="352" text-anchor="middle" fill="#e6c676" font-size="20">FROM THE ABOMINATION</text>
  <text x="200" y="376" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Daniel 12:11-12 · not to scale</text>
  <g stroke="#e6c676" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.7">
    <line x1="200" y1="386" x2="200" y2="530"/>
    <line x1="276" y1="438" x2="276" y2="530"/>
    <line x1="388" y1="490" x2="388" y2="530"/>
  </g>
  <!-- 1,260 -->
  <rect x="10" y="390" width="190" height="42" fill="#9b2226" fill-opacity="0.55" stroke="#c9a24b" stroke-width="1.2"/>
  <text x="20" y="419" fill="#ecdfc2" font-size="22">1,260 days</text>
  <!-- 1,290 -->
  <rect x="10" y="442" width="190" height="42" fill="#9b2226" fill-opacity="0.55" stroke="#c9a24b" stroke-width="1.2"/>
  <rect x="200" y="442" width="76" height="42" fill="#c9a24b" fill-opacity="0.45" stroke="#e6c676" stroke-width="1.2"/>
  <text x="20" y="471" fill="#ecdfc2" font-size="22">1,290 days</text>
  <text x="238" y="471" text-anchor="middle" fill="#ecdfc2" font-size="21">+30</text>
  <!-- 1,335 -->
  <rect x="10" y="494" width="190" height="42" fill="#9b2226" fill-opacity="0.55" stroke="#c9a24b" stroke-width="1.2"/>
  <rect x="200" y="494" width="76" height="42" fill="#c9a24b" fill-opacity="0.45" stroke="#e6c676" stroke-width="1.2"/>
  <rect x="276" y="494" width="112" height="42" fill="#c9a24b" fill-opacity="0.7" stroke="#e6c676" stroke-width="1.2"/>
  <text x="20" y="523" fill="#ecdfc2" font-size="22">1,335 days</text>
  <text x="238" y="523" text-anchor="middle" fill="#ecdfc2" font-size="21">+30</text>
  <text x="332" y="523" text-anchor="middle" fill="#ecdfc2" font-size="21">+45</text>
  <!-- 75 days bracket -->
  <path d="M200 542 L200 550 L388 550 L388 542" fill="none" stroke="#e6c676" stroke-width="2"/>
  <text x="294" y="570" text-anchor="middle" fill="#e6c676" font-size="21">75 days</text>
</svg>
