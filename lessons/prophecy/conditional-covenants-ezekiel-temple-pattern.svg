<svg xmlns="http://www.w3.org/2000/svg" width="420" height="640" viewBox="0 0 420 640" font-family="Georgia, serif" text-anchor="middle">
  <title>The pattern traced in every book: Promises and Conditions, Choices and Outcomes, Changed Promises</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9a24b"/>
    </marker>
  </defs>
  <!-- 1 -->
  <rect x="40" y="10" width="340" height="96" rx="8" fill="none" stroke="#c9a24b" stroke-width="2"/>
  <text x="210" y="48" font-size="25" fill="#e6c676">Promises and Conditions</text>
  <text x="210" y="84" font-size="20" fill="#b9a985" font-style="italic">contingent on human obedience</text>
  <line x1="210" y1="108" x2="210" y2="146" stroke="#c9a24b" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- 2 -->
  <rect x="40" y="150" width="340" height="96" rx="8" fill="none" stroke="#c9a24b" stroke-width="2"/>
  <text x="210" y="188" font-size="25" fill="#e6c676">Choices and Outcomes</text>
  <text x="210" y="224" font-size="20" fill="#b9a985" font-style="italic">free will: life and death</text>
  <line x1="150" y1="248" x2="105" y2="300" stroke="#c9a24b" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="270" y1="248" x2="315" y2="300" stroke="#9b2226" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- branches -->
  <rect x="6" y="306" width="196" height="100" rx="8" fill="none" stroke="#a9c1ea" stroke-width="2"/>
  <text x="104" y="346" font-size="22" fill="#a9c1ea" font-weight="bold">obedience</text>
  <text x="104" y="384" font-size="22" fill="#ecdfc2">blessings</text>
  <rect x="218" y="306" width="196" height="100" rx="8" fill="none" stroke="#9b2226" stroke-width="2.5"/>
  <text x="316" y="346" font-size="22" fill="#ecdfc2" font-weight="bold">disobedience</text>
  <text x="316" y="384" font-size="22" fill="#ecdfc2">curses</text>
  <line x1="316" y1="408" x2="316" y2="446" stroke="#9b2226" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- 3 -->
  <rect x="40" y="450" width="374" height="96" rx="8" fill="none" stroke="#c9a24b" stroke-width="2"/>
  <text x="227" y="488" font-size="25" fill="#e6c676">Changed Promises</text>
  <text x="227" y="524" font-size="20" fill="#b9a985" font-style="italic">redirecting blessings to others</text>
  <line x1="227" y1="548" x2="227" y2="582" stroke="#c9a24b" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="210" y="620" font-size="23" fill="#ecdfc2">the “new nation” of believers</text>
</svg>
