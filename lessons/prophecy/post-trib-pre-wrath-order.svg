<svg xmlns="http://www.w3.org/2000/svg" width="400" height="718" viewBox="0 0 400 718" font-family="Georgia, serif" role="img" aria-labelledby="t">
  <title id="t">The order of events: covenant confirmed; seals 1 to 5; the midpoint at day 1260; 75 days of great tribulation cut short; the sixth seal; the rapture; the seventh seal and half-hour silence; wrath in the trumpets and vials; Christ returns with saints at day 2520</title>
  <rect x="2" y="10" width="48" height="382" rx="4" fill="#a9c1ea" fill-opacity="0.15" stroke="#a9c1ea" stroke-opacity="0.8"/>
  <text x="22" y="201.0" transform="rotate(-90 22 201.0)" text-anchor="middle" fill="#ecdfc2" font-size="18" letter-spacing="1">TRIBULATION</text>
  <text x="43" y="201.0" transform="rotate(-90 43 201.0)" text-anchor="middle" fill="#ecdfc2" font-size="18" letter-spacing="1">CHURCH ENDURES</text>
  <rect x="2" y="478" width="48" height="148" rx="4" fill="#9b2226" fill-opacity="0.5" stroke="#9b2226" stroke-opacity="0.8"/>
  <text x="22" y="552.0" transform="rotate(-90 22 552.0)" text-anchor="middle" fill="#ecdfc2" font-size="18" letter-spacing="1">WRATH</text>
  <text x="43" y="552.0" transform="rotate(-90 43 552.0)" text-anchor="middle" fill="#ecdfc2" font-size="18" letter-spacing="1">CHURCH SPARED</text>
  <line x1="64" y1="32" x2="64" y2="656" stroke="#c9a24b" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="64" cy="32" r="7" fill="#c9a24b" stroke="#e6c676" stroke-width="1.5"/>
  <text x="82" y="39" fill="#e6c676" font-size="22">Covenant confirmed</text>
  <text x="82" y="66" fill="#ecdfc2" font-size="18">start of the 7 years · Dan 9:27</text>
  <circle cx="64" cy="110" r="7" fill="#c9a24b" stroke="#e6c676" stroke-width="1.5"/>
  <text x="82" y="117" fill="#e6c676" font-size="22">Seals 1–5</text>
  <text x="82" y="144" fill="#ecdfc2" font-size="18">war, famine, death, martyrdom</text>
  <circle cx="64" cy="188" r="7" fill="#c9a24b" stroke="#e6c676" stroke-width="1.5"/>
