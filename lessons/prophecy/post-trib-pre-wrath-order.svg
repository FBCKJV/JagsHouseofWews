  <text x="82" y="300" fill="#ecdfc2" font-size="18">great tribulation, cut short</text>
  <circle cx="64" cy="344" r="7" fill="#c9a24b" stroke="#e6c676" stroke-width="1.5"/>
  <text x="82" y="351" fill="#e6c676" font-size="22">6th seal</text>
  <text x="82" y="378" fill="#ecdfc2" font-size="18">sun black, moon blood, stars fall</text>
  <rect x="54" y="400" width="345" height="70" rx="6" fill="#c9a24b" fill-opacity="0.18" stroke="#e6c676" stroke-width="1.5"/>
  <circle cx="64" cy="422" r="9" fill="#e6c676" stroke="#e6c676" stroke-width="1.5"/>
  <text x="82" y="429" fill="#e6c676" font-size="22">Rapture · Matt 24:31</text>
  <text x="82" y="456" fill="#ecdfc2" font-size="18">angels gather the elect</text>
