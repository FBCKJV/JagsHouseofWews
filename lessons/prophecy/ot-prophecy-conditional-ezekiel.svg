<svg xmlns="http://www.w3.org/2000/svg" width="420" height="760" viewBox="0 0 420 760" font-family="Georgia, serif" text-anchor="middle">
  <title>Ezekiel's temple vision: a conditional promise, what could have been, the covenant curses, and the new covenant</title>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9a24b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9b2226"/></marker>
  </defs>
  <!-- the promise -->
  <rect x="30" y="8" width="360" height="100" rx="8" fill="none" stroke="#c9a24b" stroke-width="2"/>
  <text x="210" y="46" font-size="25" fill="#e6c676">Ezekiel’s temple vision</text>
  <text x="210" y="84" font-size="20" fill="#b9a985" font-style="italic">a conditional promise</text>
  <!-- branches -->
  <line x1="140" y1="110" x2="105" y2="170" stroke="#a9c1ea" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="280" y1="110" x2="315" y2="166" stroke="#9b2226" stroke-width="3" marker-end="url(#ar)"/>
  <text x="96" y="146" font-size="20" fill="#a9c1ea" font-weight="bold">if</text>
  <!-- what could have been (dashed: never came) -->
  <rect x="6" y="172" width="198" height="250" rx="8" fill="none" stroke="#a9c1ea" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="105" y="206" font-size="20" fill="#a9c1ea">had they repented</text>
  <text x="105" y="230" font-size="20" fill="#a9c1ea">as a nation</text>
  <text x="105" y="272" font-size="21" fill="#ecdfc2">a temple,</text>
  <text x="105" y="300" font-size="21" fill="#ecdfc2">priesthood,</text>
  <text x="105" y="328" font-size="21" fill="#ecdfc2">and kingdom</text>
  <text x="105" y="370" font-size="20" fill="#b9a985" font-style="italic">what could</text>
  <text x="105" y="394" font-size="20" fill="#b9a985" font-style="italic">have been</text>
  <!-- what happened -->
  <rect x="216" y="172" width="198" height="250" rx="8" fill="none" stroke="#9b2226" stroke-width="3"/>
  <text x="315" y="206" font-size="20" fill="#ecdfc2" font-weight="bold">Israel rejected</text>
  <text x="315" y="230" font-size="20" fill="#ecdfc2" font-weight="bold">the conditions</text>
  <text x="315" y="272" font-size="21" fill="#ecdfc2">covenant curses:</text>
  <text x="315" y="306" font-size="21" fill="#ecdfc2">exile,</text>
  <text x="315" y="334" font-size="21" fill="#ecdfc2">scattering,</text>
  <text x="315" y="362" font-size="21" fill="#ecdfc2">and desolation</text>
  <!-- grace prepared -->
  <line x1="315" y1="424" x2="250" y2="486" stroke="#c9a24b" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="350" y="466" font-size="20" fill="#b9a985" font-style="italic">His grace</text>
  <rect x="30" y="492" width="360" height="100" rx="8" fill="none" stroke="#c9a24b" stroke-width="2.5"/>
  <text x="210" y="530" font-size="25" fill="#e6c676">a new covenant</text>
  <text x="210" y="568" font-size="20" fill="#ecdfc2">fulfilled in Christ and the church</text>
  <line x1="130" y1="594" x2="110" y2="632" stroke="#c9a24b" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="290" y1="594" x2="310" y2="632" stroke="#c9a24b" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="6" y="638" width="198" height="114" rx="8" fill="none" stroke="#c9a24b" stroke-width="2"/>
  <text x="105" y="678" font-size="21" fill="#e6c676">Christ,</text>
  <text x="105" y="708" font-size="21" fill="#ecdfc2">the true temple</text>
  <rect x="216" y="638" width="198" height="114" rx="8" fill="none" stroke="#c9a24b" stroke-width="2"/>
  <text x="315" y="672" font-size="21" fill="#e6c676">the church,</text>
  <text x="315" y="702" font-size="21" fill="#ecdfc2">God’s dwelling</text>
  <text x="315" y="730" font-size="21" fill="#ecdfc2">place</text>
</svg>
