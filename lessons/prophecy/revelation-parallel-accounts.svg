<svg xmlns="http://www.w3.org/2000/svg" width="400" height="998" viewBox="0 0 400 998" font-family="Georgia, serif" role="img" aria-labelledby="t">
  <title id="t">Revelation 4 to 11 beside Revelation 12 to 22, phase by phase</title>
  <text x="99" y="28" text-anchor="middle" fill="#e6c676" font-size="23">Rev 4–11</text>
