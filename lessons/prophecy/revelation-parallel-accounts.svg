  <text x="99" y="315" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 6:1-11</text>
  <rect x="204" y="236" width="194" height="92" rx="6" fill="#a9c1ea" fill-opacity="0.12" stroke="#c9a24b" stroke-opacity="0.7"/>
