  <text x="301" y="54" text-anchor="middle" fill="#b9a985" font-size="19" font-style="italic">cosmic/earthly</text>
  <text x="200" y="94" text-anchor="middle" fill="#e6c676" font-size="20">Start of conflict</text>
  <rect x="2" y="104" width="194" height="92" rx="6" fill="#a9c1ea" fill-opacity="0.12" stroke="#c9a24b" stroke-opacity="0.7"/>
  <text x="99" y="130" text-anchor="middle" fill="#ecdfc2" font-size="20">Throne room;</text>
  <text x="99" y="155" text-anchor="middle" fill="#ecdfc2" font-size="20">Lamb takes scroll</text>
  <text x="99" y="183" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 4–5</text>
  <rect x="204" y="104" width="194" height="92" rx="6" fill="#a9c1ea" fill-opacity="0.12" stroke="#c9a24b" stroke-opacity="0.7"/>
