  <text x="200" y="622" text-anchor="middle" fill="#e6c676" font-size="20">Transition to wrath</text>
  <rect x="2" y="632" width="194" height="92" rx="6" fill="#a9c1ea" fill-opacity="0.12" stroke="#c9a24b" stroke-opacity="0.7"/>
  <text x="99" y="671" text-anchor="middle" fill="#ecdfc2" font-size="21">Half-hour silence</text>
  <text x="99" y="711" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 8:1</text>
  <rect x="204" y="632" width="194" height="92" rx="6" fill="#a9c1ea" fill-opacity="0.12" stroke="#c9a24b" stroke-opacity="0.7"/>
  <text x="301" y="658" text-anchor="middle" fill="#ecdfc2" font-size="20">Temple filled</text>
  <text x="301" y="683" text-anchor="middle" fill="#ecdfc2" font-size="20">with smoke</text>
  <text x="301" y="711" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 15:5-8</text>
  <text x="200" y="754" text-anchor="middle" fill="#e6c676" font-size="20">God’s wrath poured out</text>
  <rect x="2" y="764" width="194" height="92" rx="6" fill="#9b2226" fill-opacity="0.55" stroke="#c9a24b" stroke-opacity="0.7"/>
  <text x="99" y="803" text-anchor="middle" fill="#ecdfc2" font-size="21">Trumpets</text>
  <text x="99" y="843" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 8–9</text>
  <rect x="204" y="764" width="194" height="92" rx="6" fill="#9b2226" fill-opacity="0.55" stroke="#c9a24b" stroke-opacity="0.7"/>
  <text x="301" y="803" text-anchor="middle" fill="#ecdfc2" font-size="21">Vials</text>
  <text x="301" y="843" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 16</text>
  <text x="200" y="886" text-anchor="middle" fill="#e6c676" font-size="20">Kingdom</text>
  <rect x="2" y="896" width="194" height="92" rx="6" fill="#a9c1ea" fill-opacity="0.25" stroke="#c9a24b" stroke-opacity="0.7"/>
  <text x="99" y="935" text-anchor="middle" fill="#ecdfc2" font-size="21">7th trumpet</text>
  <text x="99" y="975" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 11:15-19</text>
  <rect x="204" y="896" width="194" height="92" rx="6" fill="#a9c1ea" fill-opacity="0.25" stroke="#c9a24b" stroke-opacity="0.7"/>
  <text x="301" y="935" text-anchor="middle" fill="#ecdfc2" font-size="21">Christ returns</text>
  <text x="301" y="975" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 19–20</text>
