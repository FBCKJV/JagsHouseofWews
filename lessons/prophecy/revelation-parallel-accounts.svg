  <text x="301" y="315" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 13:1-10</text>
  <text x="200" y="358" text-anchor="middle" fill="#e6c676" font-size="20">Climactic great tribulation</text>
  <rect x="2" y="368" width="194" height="92" rx="6" fill="#a9c1ea" fill-opacity="0.12" stroke="#c9a24b" stroke-opacity="0.7"/>
  <text x="99" y="394" text-anchor="middle" fill="#ecdfc2" font-size="20">6th seal:</text>
  <text x="99" y="419" text-anchor="middle" fill="#ecdfc2" font-size="20">cosmic disturbance</text>
  <text x="99" y="447" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 6:12-17</text>
  <rect x="204" y="368" width="194" height="92" rx="6" fill="#a9c1ea" fill-opacity="0.12" stroke="#c9a24b" stroke-opacity="0.7"/>
  <text x="301" y="394" text-anchor="middle" fill="#ecdfc2" font-size="20">Mark, image,</text>
  <text x="301" y="419" text-anchor="middle" fill="#ecdfc2" font-size="20">war on saints</text>
  <text x="301" y="447" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 13</text>
  <text x="200" y="490" text-anchor="middle" fill="#e6c676" font-size="20">Rapture &amp; saints in heaven</text>
  <rect x="2" y="500" width="194" height="92" rx="6" fill="#c9a24b" fill-opacity="0.25" stroke="#c9a24b" stroke-opacity="0.7"/>
  <text x="99" y="539" text-anchor="middle" fill="#ecdfc2" font-size="21">Great multitude</text>
  <text x="99" y="579" text-anchor="middle" fill="#b9a985" font-size="18" font-style="italic">Rev 7</text>
  <rect x="204" y="500" width="194" height="92" rx="6" fill="#c9a24b" fill-opacity="0.25" stroke="#c9a24b" stroke-opacity="0.7"/>
