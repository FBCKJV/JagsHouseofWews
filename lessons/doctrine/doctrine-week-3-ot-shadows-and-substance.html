<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shadows &amp; Substance — Adult Sunday School</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000;
    --ink2:#0d0b07;
    --gold:#d9b458;
    --gold-bright:#ffd97a;
    --crimson:#a8232f;
    --crimson-bright:#e2495a;
    --parchment:#faf6ec;
    --parchment-dim:#d8cfb8;
    --line: rgba(217,180,88,0.5);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 15% 10%, rgba(140,28,38,0.06), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(201,162,75,0.06), transparent 45%),
      var(--ink);
    color:var(--parchment);
    font-family:'Cormorant Garamond', serif;
    font-weight: 500;
    overflow:hidden;
  }
  #deck{ position:relative; width:100vw; height:100vh; }

  .frame-border{
    position:fixed; inset:14px; border:2px solid var(--gold); border-radius:4px;
    pointer-events:none; z-index:5;
    box-shadow: inset 0 0 0 1px rgba(201,162,75,0.25), inset 0 0 40px rgba(0,0,0,0.5);
  }
  .frame-border::before, .frame-border::after{
    content:"✦"; position:absolute; color:var(--gold); font-size:14px;
  }
  .frame-border::before{ top:-9px; left:-9px; }
  .frame-border::after{ bottom:-9px; right:-9px; }

  .slide{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 70px 8vw 100px 8vw;
    overflow-y:auto;
  }
  .slide.active{ display:flex; animation: fadeIn 0.6s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .roman{
    font-family:'Cinzel', serif;
    letter-spacing: 4px;
    color: var(--gold);
    font-size: 15px;
    text-transform:uppercase;
    margin-bottom: 6px;
    opacity:0.85;
  }
  h1.deck-title{
    font-family:'Cinzel Decorative', serif;
    font-size: clamp(36px, 5.2vw, 64px);
    color: var(--gold-bright);
    text-align:center;
    margin: 6px 0 4px 0;
    text-shadow: 0 0 4px rgba(0,0,0,0.9), 0 0 26px rgba(232,200,119,0.35);
  }
  h2.slide-title{
    font-family:'Cinzel', serif;
    font-size: clamp(28px, 3.6vw, 44px);
    font-weight: 600;
    color: var(--gold-bright);
    text-align:center;
    margin: 4px 0 26px 0;
    letter-spacing: 1px;
  }
  .subtitle{
    font-style:italic; color: var(--parchment-dim); text-align:left;
    margin: 0 0 30px 0; font-size: clamp(19px,1.9vw,24px);
  }
  .divider{
    width: 140px; height: 1px; margin: 18px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .content-wrap{ width:100%; max-width: 800px; margin: 0 auto; }

  .lead{
    font-size: clamp(21px,2.3vw,27px); font-weight:500; line-height:1.55; text-align:left;
    color:var(--parchment); margin-bottom: 24px;
  }
  .lead b{ color:var(--gold-bright); font-weight:700; }

  .point{
    display:flex; gap:14px; align-items:flex-start;
    margin: 16px 0; padding: 18px 22px;
    border-left: 3px solid var(--gold);
    background: rgba(201,162,75,0.08);
    border-radius: 2px;
  }
  .point .glyph{ color:var(--crimson-bright); font-size:22px; margin-top:2px; }
  .point p{ margin:0; font-size: clamp(19px,1.8vw,23px); font-weight:500; line-height:1.55; }
  .point b{ color: var(--gold-bright); font-weight:700; }
  .point i.ref{ color: var(--parchment-dim); }

  .verse-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Cinzel', serif; font-size: 15px; font-weight:600; letter-spacing: 0.5px;
    color: #000000; background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    border:none; padding: 8px 16px 7px 16px; border-radius: 20px; cursor:pointer;
    margin: 4px 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .verse-pill:hover{ transform: translateY(-2px); box-shadow: 0 4px 14px rgba(232,200,119,0.35); }
  .verse-pill::before{ content:"✦"; font-size:10px; }

  .verse-row{ text-align:center; margin: 10px 0 18px 0; }

  .cross-ref-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr));
    gap: 16px; margin-top: 22px;
  }
  .cross-card{
    border:1px solid var(--line); border-radius:6px; padding: 16px 18px;
    background: linear-gradient(160deg, rgba(140,28,38,0.10), rgba(10,9,6,0.2));
    position:relative;
  }
  .cross-card .tag{
    font-family:'Cinzel', serif; font-size:13px; font-weight:600; letter-spacing:1.5px;
    color: var(--crimson-bright); text-transform:uppercase; margin-bottom:8px; display:block;
  }
  .cross-card .body-text{ font-size: 19px; font-weight:500; line-height:1.5; color:var(--parchment); }

  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: 26px; width:100%; }
  @media (max-width: 760px){ .two-col{ grid-template-columns: 1fr; } }
  .col-card{
    border:1px solid var(--line); border-radius: 6px; padding: 18px 20px;
    background: rgba(233,223,199,0.03);
  }
  .col-card h3{
    font-family:'Cinzel', serif; color: var(--gold-bright); font-size:21px;
    letter-spacing:0.5px; margin: 0 0 10px 0; text-align:left;
  }
  .col-card p{ font-size:19px; font-weight:500; line-height:1.55; margin:6px 0; }

  .takeaway-list{ list-style:none; padding:0; margin: 8px 0 0 0; }
  .takeaway-list li{
    font-size: clamp(19px,1.9vw,23px); font-weight:500; line-height:1.55; padding: 12px 0 12px 32px;
    position:relative; border-bottom: 1px dashed var(--line);
  }
  .takeaway-list li::before{ content:"✦"; position:absolute; left:0; color:var(--gold); }
  .takeaway-list li:last-child{ border-bottom:none; }

  .closing{
    text-align:center; margin-top: 20px; padding: 20px 26px;
    border: 1px solid var(--gold); border-radius: 6px;
    background: rgba(140,28,38,0.08); width:100%;
  }
  .closing .cv{ font-style: italic; font-weight:600; font-size: clamp(20px,2.1vw,25px); color: var(--gold-bright); }
  .closing .cite{ display:block; margin-top:8px; font-family:'Cinzel', serif; font-size:14px; letter-spacing:1px; color: var(--parchment-dim); }

  .verse-quote{
    margin: 14px 0; padding: 18px 24px;
    border-left: 3px solid var(--crimson-bright);
    background: rgba(233,223,199,0.05);
    border-radius: 2px;
  }
  .verse-quote a.vref{
    display:block; font-family:'Cinzel', serif; font-size: 15px; font-weight:600; letter-spacing: 1.5px;
    color: var(--gold-bright); text-decoration:none; margin-bottom: 8px;
  }
  .verse-quote a.vref:hover{ color: var(--crimson-bright); text-decoration: underline; }
  .verse-quote p{ margin:0; font-style: italic; font-weight:500; font-size: clamp(19px,1.9vw,23px); line-height:1.6; color: var(--parchment); }
  .connector-text{
    text-align:left; margin: 14px 0; font-size: clamp(18px,1.7vw,21px);
    font-weight:500; color: var(--parchment-dim); line-height:1.55;
  }

  /* Nav */
  #nav{
    position: fixed; bottom: 26px; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap: 18px; z-index: 20;
  }
  .navbtn{
    font-family:'Cinzel', serif; letter-spacing:1px; font-size:15px; font-weight:600;
    color: var(--gold-bright); background: rgba(0,0,0,0.85);
    border: 1px solid var(--gold); padding: 11px 22px; border-radius: 22px; cursor:pointer;
    transition: background 0.2s;
  }
  .navbtn:hover{ background: rgba(201,162,75,0.22); }
  .navbtn:disabled{ opacity:0.3; cursor:default; }
  #dots{ display:flex; gap:9px; }
  .dot{ width:10px; height:10px; border-radius:50%; background: rgba(201,162,75,0.35); cursor:pointer; transition: background 0.2s; }
  .dot.active{ background: var(--gold-bright); box-shadow: 0 0 8px var(--gold-bright); }

  #progress-label{
    position: fixed; top: 26px; right: 40px; z-index:20;
    font-family:'Cinzel', serif; font-size: 12px; letter-spacing: 2px; color: var(--parchment-dim);
  }

  /* Modal */
  #modal-overlay{
    position:fixed; inset:0; background: rgba(0,0,0,0.78); backdrop-filter: blur(3px);
    display:none; align-items:center; justify-content:center; z-index: 100; padding: 30px;
  }
  #modal-overlay.open{ display:flex; }
  #modal-box{
    max-width: 680px; max-height: 80vh; overflow-y:auto;
    background: linear-gradient(160deg, #17130b, #0c0a06);
    border: 1px solid var(--gold); border-radius: 8px;
    padding: 30px 34px; position:relative;
    box-shadow: 0 0 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(201,162,75,0.15);
  }
  #modal-box h4{
    font-family:'Cinzel', serif; color: var(--gold-bright); font-size: 23px;
    margin: 0 0 14px 0; letter-spacing:1px; text-align:center;
  }
  #modal-box .kjv-text{
    font-size: clamp(20px,2.3vw,25px); font-weight:500; line-height:1.7; color: var(--parchment);
    font-style: italic;
  }
  #modal-close{
    position:absolute; top:12px; right:16px; background:none; border:none;
    color: var(--gold); font-size: 22px; cursor:pointer; line-height:1;
  }
  #modal-close:hover{ color: var(--crimson-bright); }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(201,162,75,0.4); border-radius:4px; }
</style>
<script src="../deck-extras.js"></script>
</head>
<body>

<div class="frame-border"></div>
<div id="progress-label"></div>
<div id="deck"></div>

<div id="nav">
  <button class="navbtn" id="prevBtn">◄ PREV</button>
  <div id="dots"></div>
  <button class="navbtn" id="nextBtn">NEXT ►</button>
</div>

<div id="modal-overlay">
  <div id="modal-box">
    <button id="modal-close">✕</button>
    <h4 id="modal-ref"></h4>
    <div class="kjv-text" id="modal-text"></div>
  </div>
</div>

function versePill(ref){
  return `<button class="verse-pill" onclick="openVerse('${ref.replace(/'/g,"\\'")}')">${ref}</button>`;
}

// 1 — TITLE

      <p class="connector-text">There is a misunderstanding among many about the Old Testament's commands for building a temple to offer blood sacrifice to God. People ask, how does this line up with the understanding that we are saved by faith in the sacrifice of Jesus alone in the New Testament? Does this mean works were needed to be saved in the Old Testament?</p>

let current = 0;
const deck = document.getElementById('deck');
const dotsEl = document.getElementById('dots');
const progressLabel = document.getElementById('progress-label');

function render(){
  deck.innerHTML = SLIDES.map((s,i)=>`<div class="slide ${i===current?'active':''}">${s.roman?`<div class="roman">${s.roman}</div>`:""}${s.html}</div>`).join('');
  dotsEl.innerHTML = SLIDES.map((_,i)=>`<div class="dot ${i===current?'active':''}" onclick="goTo(${i})"></div>`).join('');
  progressLabel.textContent = `${current+1} / ${SLIDES.length}`;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===SLIDES.length-1;
}
function goTo(i){ current = Math.max(0, Math.min(SLIDES.length-1, i)); render(); }
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
  if(e.key==='Escape') closeVerse();
});

function openVerse(ref){
  document.getElementById('modal-ref').textContent = ref;
  document.getElementById('modal-text').textContent = VERSES[ref] || "(text unavailable)";
  document.getElementById('modal-overlay').classList.add('open');
}
function closeVerse(){ document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-close').onclick = closeVerse;
document.getElementById('modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id==='modal-overlay') closeVerse();
});

render();
</script>
