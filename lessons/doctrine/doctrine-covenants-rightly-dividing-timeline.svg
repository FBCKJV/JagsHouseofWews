<svg xmlns="http://www.w3.org/2000/svg" width="360" height="956" viewBox="0 0 360 956" font-family="Georgia, serif" text-anchor="middle">
  <title>A biblical timeline of conditional promises, from Genesis to the prophets (what could have been), through the kingdom offer and its rejection, to the new covenant and Christ's Second Coming (what will be)</title>
  <line x1="18" y1="82" x2="18" y2="362" stroke="#a9c1ea" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="18" y1="490" x2="18" y2="700" stroke="#9b2226" stroke-width="3"/>
  <line x1="18" y1="828" x2="18" y2="898" stroke="#c9a24b" stroke-width="3"/>
  <text x="180" y="36" font-size="20" fill="#a9c1ea" letter-spacing="1.5">WHAT COULD HAVE BEEN</text>
  <line x1="24" y1="50" x2="336" y2="50" stroke="#a9c1ea" stroke-width="1.5" opacity=".6"/>
  <circle cx="18" cy="82" r="8" fill="#a9c1ea"/>
  <text x="38" y="89" font-size="21" fill="#ecdfc2" text-anchor="start">Genesis</text>
  <text x="38" y="114" font-size="17" fill="#b9a985" font-style="italic" text-anchor="start">The Foundation of Winnowing</text>
  <circle cx="18" cy="152" r="8" fill="#a9c1ea"/>
  <text x="38" y="159" font-size="21" fill="#ecdfc2" text-anchor="start">Exodus and Leviticus</text>
  <text x="38" y="184" font-size="17" fill="#b9a985" font-style="italic" text-anchor="start">National Promises and Priesthood</text>
  <circle cx="18" cy="222" r="8" fill="#a9c1ea"/>
  <text x="38" y="229" font-size="21" fill="#ecdfc2" text-anchor="start">Numbers and Deuteronomy</text>
  <text x="38" y="254" font-size="17" fill="#b9a985" font-style="italic" text-anchor="start">Forfeiture of the Promised Land</text>
  <circle cx="18" cy="292" r="8" fill="#a9c1ea"/>
  <text x="38" y="299" font-size="21" fill="#ecdfc2" text-anchor="start">Joshua to 1 Kings</text>
  <text x="38" y="324" font-size="17" fill="#b9a985" font-style="italic" text-anchor="start">Forfeited Dynasties</text>
  <circle cx="18" cy="362" r="8" fill="#a9c1ea"/>
  <text x="38" y="369" font-size="21" fill="#ecdfc2" text-anchor="start">The Prophets</text>
  <text x="38" y="394" font-size="17" fill="#b9a985" font-style="italic" text-anchor="start">Reprobate Silver</text>
  <text x="180" y="444" font-size="20" fill="#e6c676" letter-spacing="1.5">THE KINGDOM OFFER</text>
  <line x1="24" y1="458" x2="336" y2="458" stroke="#e6c676" stroke-width="1.5" opacity=".6"/>
  <circle cx="18" cy="490" r="8" fill="#9b2226"/>
  <text x="38" y="497" font-size="21" fill="#ecdfc2" text-anchor="start">1 · The Opening</text>
  <text x="38" y="522" font-size="17" fill="#b9a985" font-style="italic" text-anchor="start">John the Baptist and Jesus preached</text>
  <circle cx="18" cy="560" r="8" fill="#9b2226"/>
  <text x="38" y="567" font-size="21" fill="#ecdfc2" text-anchor="start">2 · The Rise of Rejection</text>
  <text x="38" y="592" font-size="17" fill="#b9a985" font-style="italic" text-anchor="start">blasphemy against the Holy Ghost</text>
  <circle cx="18" cy="630" r="8" fill="#9b2226"/>
  <text x="38" y="637" font-size="21" fill="#ecdfc2" text-anchor="start">3 · The Official Rejection</text>
  <text x="38" y="662" font-size="17" fill="#b9a985" font-style="italic" text-anchor="start">at the Cross</text>
  <circle cx="18" cy="700" r="8" fill="#9b2226"/>
  <text x="38" y="707" font-size="21" fill="#ecdfc2" text-anchor="start">4 · The Last Straw</text>
  <text x="38" y="732" font-size="17" fill="#b9a985" font-style="italic" text-anchor="start">the martyrdom of Stephen, Acts 7</text>
  <text x="180" y="782" font-size="20" fill="#e6c676" letter-spacing="1.5">WHAT WILL BE</text>
  <line x1="24" y1="796" x2="336" y2="796" stroke="#e6c676" stroke-width="1.5" opacity=".6"/>
  <circle cx="18" cy="828" r="8" fill="#c9a24b"/>
  <text x="38" y="835" font-size="21" fill="#e6c676" text-anchor="start">The new covenant</text>
  <text x="38" y="860" font-size="17" fill="#b9a985" font-style="italic" text-anchor="start">a universal, spiritual kingdom</text>
  <circle cx="18" cy="898" r="8" fill="#c9a24b"/>
  <text x="38" y="905" font-size="21" fill="#e6c676" text-anchor="start">Christ’s Second Coming</text>
  <text x="38" y="930" font-size="17" fill="#b9a985" font-style="italic" text-anchor="start">the earthly kingdom</text>
</svg>
